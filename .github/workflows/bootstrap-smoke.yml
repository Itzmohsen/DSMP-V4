name: DSMP Bootstrap Smoke Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bootstrap:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Verify POSIX launcher
        if: runner.os != 'Windows'
        run: ./start_modern.sh --help

      - name: Verify Windows launcher
        if: runner.os == 'Windows'
        run: .\start_modern.bat --help

      - name: Verify bootstrap and dependencies
        run: python build.py doctor

      - name: Compile simulator sources
        run: python build.py compile

      - name: Verify repeat bootstrap is offline-ready
        run: python build.py doctor
        env:
          PIP_NO_INDEX: "1"
